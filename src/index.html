<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎓 QuizFlow</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>🎓 QuizFlow</h1>

      <p class="subtitle">Platform Kuis Sederhana untuk Dosen dan Mahasiswa</p>

      <!-- Statistik -->
      <div class="stats">
        <div class="stat-card">
          <h2 id="questionCount">0</h2>
          <p>Total Soal</p>
        </div>

        <div class="stat-card">
          <h2 id="studentCount">0</h2>
          <p>Mahasiswa</p>
        </div>
      </div>

      <!-- Menu -->
      <div class="tabs">
        <button onclick="showCreate()">📝 Buat Soal</button>

        <button onclick="showQuiz()">🚀 Mulai Kuis</button>
      </div>

      <hr />

      <!-- FORM BUAT SOAL -->

      <div id="createSection" class="quiz-card">
        <h2>Buat Soal</h2>

        <label>Pertanyaan</label>
        <input type="text" id="question" placeholder="Contoh: 2 + 2 = ?" />

        <label>Pilihan A</label>
        <input type="text" id="optionA" />

        <label>Pilihan B</label>
        <input type="text" id="optionB" />

        <label>Pilihan C</label>
        <input type="text" id="optionC" />

        <label>Pilihan D</label>
        <input type="text" id="optionD" />

        <label>Jawaban Benar</label>

        <select id="correct">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>

        <button class="save-btn" onclick="saveQuestion()">Simpan Soal</button>
      </div>

      <!-- AREA KUIS -->

      <div id="quizSection" class="quiz-card" style="display: none">
        <h2>Mulai Kuis</h2>

        <label>Nama Mahasiswa</label>

        <input
          type="text"
          id="studentName"
          placeholder="Masukkan nama mahasiswa"
        />

        <button class="start-btn" onclick="startQuiz()">Mulai Kuis</button>

        <!-- Progress Bar -->

        <div class="progress-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <!-- Soal Kuis -->

        <div id="quizArea"></div>

        <!-- Tabel Hasil -->

        <h2>📊 Data Mahasiswa</h2>

        <table id="studentTable">
          <thead>
            <tr>
              <th>Nama Mahasiswa</th>
              <th>Nilai</th>
            </tr>
          </thead>

          <tbody id="studentBody"></tbody>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
